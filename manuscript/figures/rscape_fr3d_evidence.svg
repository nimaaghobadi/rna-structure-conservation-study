<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">R-scape RNA pair candidates compared with FR3D interactions in 9ZTL</title>
<desc id="desc">Five horizontal stacked bars show direct base-pair annotations, stacking-only interactions, no direct pair annotation, and pairs not assessable because a model position is absent from the deposited chain.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="64" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#172b3a">R-scape pair candidates mapped to 9ZTL structural interactions</text>
<text x="64" y="82" font-family="Arial,sans-serif" font-size="16" fill="#536675">FR3D geometric annotations · one deposited E. coli ribosome model · RF-model coordinate system</text>
<rect x="64" y="112" width="14" height="14" rx="2" fill="#2A7F62"/>
<text x="85" y="124" font-family="Arial,sans-serif" font-size="13" fill="#334653">Direct base-pair annotation</text>
<rect x="299" y="112" width="14" height="14" rx="2" fill="#D69E36"/>
<text x="320" y="124" font-family="Arial,sans-serif" font-size="13" fill="#334653">Stacking only</text>
<rect x="434" y="112" width="14" height="14" rx="2" fill="#89939D"/>
<text x="455" y="124" font-family="Arial,sans-serif" font-size="13" fill="#334653">No direct pair annotation</text>
<rect x="659" y="112" width="14" height="14" rx="2" fill="#B65353"/>
<text x="680" y="124" font-family="Arial,sans-serif" font-size="13" fill="#334653">Not assessable</text>
<text x="64" y="207" font-family="Arial,sans-serif" font-size="16" fill="#203543">5S rRNA · annotated, R-scape significant</text>
<rect x="390.0" y="185" width="621.8" height="34" fill="#2A7F62"/>
<text x="700.9" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">19</text>
<rect x="1011.8" y="185" width="98.2" height="34" fill="#89939D"/>
<text x="1060.9" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
<text x="1122.0" y="207" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#203543">n=22</text>
<line x1="390" y1="232" x2="1110" y2="232" stroke="#e7ecef" stroke-width="1"/>
<text x="64" y="291" font-family="Arial,sans-serif" font-size="16" fill="#203543">5S rRNA · annotated, R-scape not detected</text>
<rect x="390.0" y="269" width="130.9" height="34" fill="#2A7F62"/>
<text x="455.5" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>
<rect x="520.9" y="269" width="261.8" height="34" fill="#89939D"/>
<text x="651.8" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">8</text>
<text x="794.7" y="291" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#203543">n=12</text>
<line x1="390" y1="316" x2="1110" y2="316" stroke="#e7ecef" stroke-width="1"/>
<text x="64" y="375" font-family="Arial,sans-serif" font-size="16" fill="#203543">5S rRNA · additional covariation candidates</text>
<rect x="390.0" y="353" width="229.1" height="34" fill="#2A7F62"/>
<text x="504.5" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">7</text>
<rect x="619.1" y="353" width="32.7" height="34" fill="#89939D"/>
<text x="635.5" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
<rect x="651.8" y="353" width="32.7" height="34" fill="#B65353"/>
<text x="668.2" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
<text x="696.5" y="375" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#203543">n=9</text>
<line x1="390" y1="400" x2="1110" y2="400" stroke="#e7ecef" stroke-width="1"/>
<text x="64" y="459" font-family="Arial,sans-serif" font-size="16" fill="#203543">tRNA · annotated, R-scape significant</text>
<rect x="390.0" y="437" width="654.5" height="34" fill="#2A7F62"/>
<text x="717.3" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">20</text>
<rect x="1044.5" y="437" width="32.7" height="34" fill="#89939D"/>
<text x="1060.9" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
<text x="1089.3" y="459" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#203543">n=21</text>
<line x1="390" y1="484" x2="1110" y2="484" stroke="#e7ecef" stroke-width="1"/>
<text x="64" y="543" font-family="Arial,sans-serif" font-size="16" fill="#203543">tRNA · additional covariation candidates</text>
<rect x="390.0" y="521" width="32.7" height="34" fill="#2A7F62"/>
<text x="406.4" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
<rect x="422.7" y="521" width="130.9" height="34" fill="#D69E36"/>
<text x="488.2" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172b3a">4</text>
<rect x="553.6" y="521" width="425.5" height="34" fill="#89939D"/>
<text x="766.4" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">13</text>
<text x="991.1" y="543" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#203543">n=18</text>
<line x1="390" y1="568" x2="1110" y2="568" stroke="#e7ecef" stroke-width="1"/>
<text x="64" y="612" font-family="Arial,sans-serif" font-size="13" fill="#536675">“No direct pair annotation” is not proof of absence. Stacking-only is not base-pair support.</text>
<text x="64" y="634" font-family="Arial,sans-serif" font-size="13" fill="#536675">The tRNA result applies to the single P-site tRNA chain in 9ZTL, not every RF00005 family member.</text>
</svg>
