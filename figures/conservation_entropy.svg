<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Paired and unpaired sequence conservation and entropy in 5S rRNA and tRNA</title>
<desc id="desc">Two panels compare mean per-column conservation and Shannon entropy for paired and unpaired columns in the Rfam 15.1 seed alignments. Values are descriptive means across alignment columns.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#202733}
.main-title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#4b5563}
.panel-title{font-size:19px;font-weight:700}.axis{stroke:#64748b;stroke-width:1.4}
.grid{stroke:#e2e8f0;stroke-width:1}.tick{font-size:12px;fill:#64748b}
.value{font-size:13px;font-weight:700}.bar-label{font-size:12px}
.column-label{font-size:11px;fill:#64748b}.family-label{font-size:15px;font-weight:700}
.sequence-label{font-size:11px;fill:#64748b}.axis-label{font-size:12px;fill:#4b5563}
.legend{font-size:13px}.note{font-size:12px;fill:#4b5563}
</style>
<rect width="1200" height="680" fill="#fff"/>
<text x="48" y="48" class="main-title">Paired and unpaired positions show different sequence patterns</text>
<text x="48" y="75" class="subtitle">Rfam 15.1 seed alignments · descriptive column means · paired status follows the consensus secondary-structure annotation</text>
<rect x="820" y="92" width="16" height="16" rx="3" fill="#2563a6"/><text x="844" y="105" class="legend">Paired</text>
<rect x="925" y="92" width="16" height="16" rx="3" fill="#c46b25"/><text x="949" y="105" class="legend">Unpaired</text>
<text x="55" y="118" class="panel-title">A. Mean single-site conservation</text>
<line x1="123" y1="160" x2="123" y2="490" class="axis"/>
<line x1="123" y1="490" x2="553" y2="490" class="axis"/>
<line x1="123" y1="490.0" x2="553" y2="490.0" class="grid"/>
<text x="111" y="494.0" text-anchor="end" class="tick">0</text>
<line x1="123" y1="407.5" x2="553" y2="407.5" class="grid"/>
<text x="111" y="411.5" text-anchor="end" class="tick">0.25</text>
<line x1="123" y1="325.0" x2="553" y2="325.0" class="grid"/>
<text x="111" y="329.0" text-anchor="end" class="tick">0.5</text>
<line x1="123" y1="242.5" x2="553" y2="242.5" class="grid"/>
<text x="111" y="246.5" text-anchor="end" class="tick">0.75</text>
<line x1="123" y1="160.0" x2="553" y2="160.0" class="grid"/>
<text x="111" y="164.0" text-anchor="end" class="tick">1</text>
<rect x="166.0" y="275.7" width="62" height="214.3" rx="5" fill="#2563a6"/>
<text x="197.0" y="265.7" text-anchor="middle" class="value">0.649</text>
<text x="197.0" y="512" text-anchor="middle" class="bar-label">paired</text>
<text x="197.0" y="529" text-anchor="middle" class="column-label">n=68 columns</text>
<rect x="242.0" y="252.2" width="62" height="237.8" rx="5" fill="#c46b25"/>
<text x="273.0" y="242.2" text-anchor="middle" class="value">0.720</text>
<text x="273.0" y="512" text-anchor="middle" class="bar-label">unpaired</text>
<text x="273.0" y="529" text-anchor="middle" class="column-label">n=52 columns</text>
<text x="235.0" y="558" text-anchor="middle" class="family-label">5S rRNA</text>
<text x="235.0" y="577" text-anchor="middle" class="sequence-label">712 sequences</text>
<rect x="376.0" y="333.4" width="62" height="156.6" rx="5" fill="#2563a6"/>
<text x="407.0" y="323.4" text-anchor="middle" class="value">0.474</text>
<text x="407.0" y="512" text-anchor="middle" class="bar-label">paired</text>
<text x="407.0" y="529" text-anchor="middle" class="column-label">n=42 columns</text>
<rect x="452.0" y="269.6" width="62" height="220.4" rx="5" fill="#c46b25"/>
<text x="483.0" y="259.6" text-anchor="middle" class="value">0.668</text>
<text x="483.0" y="512" text-anchor="middle" class="bar-label">unpaired</text>
<text x="483.0" y="529" text-anchor="middle" class="column-label">n=29 columns</text>
<text x="445.0" y="558" text-anchor="middle" class="family-label">tRNA</text>
<text x="445.0" y="577" text-anchor="middle" class="sequence-label">954 sequences</text>
<text x="338" y="608" text-anchor="middle" class="axis-label">Mean conservation (0–1)</text>
<text x="650" y="118" class="panel-title">B. Mean Shannon entropy</text>
<line x1="718" y1="160" x2="718" y2="490" class="axis"/>
<line x1="718" y1="490" x2="1148" y2="490" class="axis"/>
<line x1="718" y1="490.0" x2="1148" y2="490.0" class="grid"/>
<text x="706" y="494.0" text-anchor="end" class="tick">0</text>
<line x1="718" y1="407.5" x2="1148" y2="407.5" class="grid"/>
<text x="706" y="411.5" text-anchor="end" class="tick">0.5</text>
<line x1="718" y1="325.0" x2="1148" y2="325.0" class="grid"/>
<text x="706" y="329.0" text-anchor="end" class="tick">1</text>
<line x1="718" y1="242.5" x2="1148" y2="242.5" class="grid"/>
<text x="706" y="246.5" text-anchor="end" class="tick">1.5</text>
<line x1="718" y1="160.0" x2="1148" y2="160.0" class="grid"/>
<text x="706" y="164.0" text-anchor="end" class="tick">2</text>
<rect x="761.0" y="291.8" width="62" height="198.2" rx="5" fill="#2563a6"/>
<text x="792.0" y="281.8" text-anchor="middle" class="value">1.201</text>
<text x="792.0" y="512" text-anchor="middle" class="bar-label">paired</text>
<text x="792.0" y="529" text-anchor="middle" class="column-label">n=68 columns</text>
<rect x="837.0" y="319.5" width="62" height="170.5" rx="5" fill="#c46b25"/>
<text x="868.0" y="309.5" text-anchor="middle" class="value">1.033</text>
<text x="868.0" y="512" text-anchor="middle" class="bar-label">unpaired</text>
<text x="868.0" y="529" text-anchor="middle" class="column-label">n=52 columns</text>
<text x="830.0" y="558" text-anchor="middle" class="family-label">5S rRNA</text>
<text x="830.0" y="577" text-anchor="middle" class="sequence-label">712 sequences</text>
<rect x="971.0" y="216.8" width="62" height="273.2" rx="5" fill="#2563a6"/>
<text x="1002.0" y="206.8" text-anchor="middle" class="value">1.656</text>
<text x="1002.0" y="512" text-anchor="middle" class="bar-label">paired</text>
<text x="1002.0" y="529" text-anchor="middle" class="column-label">n=42 columns</text>
<rect x="1047.0" y="297.4" width="62" height="192.6" rx="5" fill="#c46b25"/>
<text x="1078.0" y="287.4" text-anchor="middle" class="value">1.167</text>
<text x="1078.0" y="512" text-anchor="middle" class="bar-label">unpaired</text>
<text x="1078.0" y="529" text-anchor="middle" class="column-label">n=29 columns</text>
<text x="1040.0" y="558" text-anchor="middle" class="family-label">tRNA</text>
<text x="1040.0" y="577" text-anchor="middle" class="sequence-label">954 sequences</text>
<text x="933" y="608" text-anchor="middle" class="axis-label">Entropy (bits)</text>
<text x="48" y="660" class="note">Each bar is the mean across eligible alignment columns (column counts shown below). Columns are not independent replicates; no p-values or inferential error bars are shown.</text>
</svg>